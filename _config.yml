# Site settings
title: Cho Research Group
email: ycho12@uh.edu
description: Homepage of Cho Research Group!
baseurl: 
url: http://ysc.chem.uh.edu

# Google analytics ID: Uncomment and your own, if you like
# google_analytics: XX
# google_analytics_4: XXX
# google_tag_manager: XXX

# Footer info
affiliation: >
  Cho Research Group<br/>
  Department of Chemistry<br/>
  University of Houston

location: >
  University of Houston<br/>
  3585 Cullen Blvd. Rm 221<br/>
  Houston, TX 77204

contact: >
  ycho12@uh.edu

# Pages shown in navbar
nav_pages:
  - name: research
  - name: people
  - name: publications
  - name: news
  - name: openings

include:
  - .htaccess
  - _pages

# Conversion
markdown: kramdown
highlighter: rouge
lsi: false
excerpt_separator: "\n\n"
incremental: false

# Markdown Processing
kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..6
  smart_quotes: lsquo,rsquo,ldquo,rdquo
  enable_coderay: false
  parse_block_html: true # default for kramdown is false. This will enable using Markdown links

plugins: ["jekyll/scholar"]

scholar:
  last_name: Cho
  first_name: [Yeongsu]

  style: citesty
  locale: en

  source: /assets/
  bibliography: ref.bib
  bibliography_template: bibtemplate
  sort_by: year, month
  order: descending

  replace_strings: true
  join_strings: true

  details_dir: bibliography
  details_layout: bibtex.html
  details_link: Details

  query: "@*"

  bibliography_list_attributes:
    reversed: "reversed"

exclude:
  - Gemfile
  - Gemfile.lock
  - update_boostrap.sh
  - switch_theme.sh
  - tags
  - Rakefile
